<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lioran · 先理解，再问清楚</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--line:#e3e8ef;--ink:#1f2937;--muted:#6b7280;--blue:#185fa5;--blue-soft:#e6f1fb;--purple:#534ab7;--purple-soft:#eeedfe;--amber:#854f0b;--amber-soft:#faeeda;--green:#0f6e56;--green-soft:#e1f5ee}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
    .app{max-width:1160px;margin:0 auto;padding:26px 22px 40px}
    header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:600}
    .mark{width:26px;height:26px;border-radius:8px;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:14px}
    header p{margin:0;color:var(--muted);font-size:13px}
    .layout{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .panel-head{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center}
    .inputs{padding:16px}
    .inputs label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
    .inputs input,.inputs textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:var(--ink);margin-bottom:12px}
    .inputs textarea{resize:vertical;min-height:58px}
    .inputs input:focus,.inputs textarea:focus{border-color:var(--blue)}
    .primary{width:100%;border:0;border-radius:9px;padding:10px;font-size:13px;font-family:inherit;cursor:pointer;background:var(--purple);color:#fff}
    .primary:disabled{background:#d8d8e3;cursor:default}
    .chat{height:520px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
    .msg{max-width:94%;padding:11px 14px;border-radius:12px;font-size:13px;white-space:pre-wrap}
    .msg.ai{align-self:flex-start;background:#fafbfd;border:1px solid var(--line);width:94%}
    .msg.user{align-self:flex-end;background:var(--blue-soft);border:1px solid #cfe2f6}
    .msg .who{font-size:11px;color:var(--muted);margin-bottom:4px}
    .label{display:inline-block;font-size:10px;padding:1px 7px;border-radius:5px;background:var(--purple-soft);color:var(--purple);margin-right:6px}
    .q{border-top:1px solid var(--line);padding:10px 0 2px;margin-top:10px}
    .q:first-of-type{border-top:0;margin-top:4px}
    .q p{margin:0 0 7px;font-size:13px}
    .qwhy{font-size:11px;color:var(--muted);background:#f4f7fb;border-radius:6px;padding:6px 9px;margin:0 0 8px;line-height:1.55}
    .qwhy b{color:var(--ink);font-weight:500}
    .opts{display:flex;flex-wrap:wrap;gap:7px}
    .opt{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit}
    .opt.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
    .opt:disabled{cursor:default;opacity:.7}
    .submit{margin-top:14px;border:0;background:var(--purple);color:#fff;border-radius:8px;padding:8px 15px;font-size:12px;cursor:pointer;font-family:inherit}
    .submit:disabled{background:#d8d8e3;cursor:default}
    .recheck label{display:block;font-size:12px;padding:3px 0}
    .composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
    .composer input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;outline:none}
    .composer button{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:0 15px;font-size:13px;cursor:pointer;font-family:inherit}
    .badge{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--amber-soft);color:var(--amber);font-weight:400}
    .badge.ready{background:var(--green-soft);color:var(--green)}
    .side{padding:13px 15px}
    .progress{height:5px;background:#eef1f5;border-radius:3px;overflow:hidden;margin:0 0 12px}
    .progress i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
    #items{max-height:280px;overflow-y:auto}
    .group{margin-bottom:10px}
    .group h4{margin:0 0 5px;font-size:11px;color:var(--muted);font-weight:500}
    .row{display:flex;gap:7px;align-items:flex-start;padding:4px 0;font-size:11.5px;border-bottom:1px dashed #f0f2f6;cursor:pointer}
    .row:hover{background:#fafbfd}
    .dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;background:#c9ced8}
    .row.ok .dot{background:var(--green)}
    .row .k{color:var(--muted);width:74px;flex:none}
    .row .v{flex:1;word-break:break-all}
    .row:not(.ok) .v{color:var(--amber)}
    .tag{font-size:9px;padding:0 5px;border-radius:4px;background:#f1efe8;color:#5f5e5a;flex:none;margin-top:3px}
    .tag.amb{background:var(--amber-soft);color:var(--amber)}
    .tag.said{background:var(--green-soft);color:var(--green)}
    .detail{background:#f7f9fc;border-left:2px solid var(--blue);padding:6px 9px;margin:3px 0 6px;font-size:11px;color:var(--muted);line-height:1.6}
    .detail b{color:var(--ink);font-weight:500}
    .rules{border-top:1px solid var(--line);padding-top:10px;margin:8px 0 12px}
    .rules h4{margin:0 0 5px;font-size:11px;color:var(--muted);font-weight:500}
    #rules{max-height:140px;overflow-y:auto;font-size:11px;color:var(--muted)}
    #rules div{padding:3px 0;border-bottom:1px dashed #f0f2f6}
    #rules b{color:var(--ink);font-weight:500}
    .confirm{width:100%;border:0;border-radius:10px;padding:11px;font-size:13px;font-family:inherit;cursor:pointer;background:var(--green);color:#fff}
    .confirm:disabled{background:#e6e9ee;color:#9aa1ad;cursor:default}
    header a{margin-left:auto;color:var(--muted);font-size:13px;text-decoration:none}
    .tip{text-align:center;font-size:11px;color:var(--muted);margin:8px 0 0}
    .err{color:#a32d2d;font-size:12px;padding:8px 16px}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="mark">L</span>Lioran</div>
    <p>政策法规 · 先理解 → 再逐项问清 → 用户拍板 → 才放行抓取</p>
    <a id="back-home" href="/">返回提取</a>
  </header>
  <div class="layout">
    <section class="panel">
      <div class="panel-head"><span>理解与问答</span><span style="font-weight:400;color:var(--muted);font-size:11px" id="phase">待开始</span></div>
      <div class="inputs">
        <label for="url">网页链接</label>
        <input id="url" type="text" placeholder="公开的政策法规栏目地址">
        <label for="requirement">要的信息（要抓什么）</label>
        <textarea id="requirement" placeholder="例如：政策法规库里所有文件的标题、发文字号、发文机关、成文日期、原文链接、效力状态"></textarea>
        <label for="review">审查信息（筛选标准）</label>
        <textarea id="review" placeholder="例如：只要 2024 年以后的现行有效政策，别转发件，最多 20 条"></textarea>
        <button class="primary" id="start">开始理解（不抓取）</button>
      </div>
      <div class="chat" id="chat"></div>
      <div class="err" id="err" hidden></div>
      <div class="composer">
        <input id="note" placeholder="补充一句，例如：附件里的数据表也要单独列出来">
        <button id="send-note">发送</button>
      </div>
    </section>
    <aside class="panel">
      <div class="panel-head"><span>标准清单（点开看细节）</span><span class="badge" id="badge">未开始</span></div>
      <div class="side">
        <div class="progress"><i id="bar"></i></div>
        <div id="items"></div>
        <div class="rules">
          <h4 id="rules-head">拍板后的可执行判定规则</h4>
          <div id="rules"></div>
        </div>
        <button class="confirm" id="confirm" disabled>确认并锁定规格</button>
        <p class="tip" id="tip">模糊项没有清零前，不能放行</p>
      </div>
    </aside>
  </div>
</div>
<script src="/static/clarify.js" defer></script>
</body>
</html>
