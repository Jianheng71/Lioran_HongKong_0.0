<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Lioran - 网页数据提取</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Lioran home">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span>Lioran</span>
      </a>
      <button id="language-toggle" class="language-toggle" type="button" aria-label="切换语言">中 / EN</button>
    </header>

    <section class="hero">
      <p class="eyebrow" data-i18n="eyebrow">本地运行 · 无需编程</p>
      <h1 data-i18n="title">粘贴链接，说出你想要的数据</h1>
      <p class="subtitle" data-i18n="subtitle">Lioran 会理解公开网页，并把你需要的信息整理成表格。</p>
    </section>

    <section class="panel input-panel" aria-labelledby="form-title">
      <h2 id="form-title" class="visually-hidden" data-i18n="formTitle">开始提取</h2>
      <form id="scrape-form">
        <label for="url-input" data-i18n="urlLabel">网页链接</label>
        <input id="url-input" name="url" type="url" placeholder="https://example.com/news" autocomplete="url" required>

        <label for="requirement-input" data-i18n="requirementLabel">你想提取什么？</label>
        <textarea id="requirement-input" name="requirement" rows="3" maxlength="1000"
          placeholder="例如：我要序号、标题、链接、时间、摘要、栏目名称和类别" required></textarea>

        <div class="crawl-options">
          <div class="page-limit">
            <label for="max-pages-input" data-i18n="maxPagesLabel">最大页数</label>
            <input id="max-pages-input" name="max_pages" type="number" min="1" max="500" value="500">
          </div>
          <p class="option-hint" data-i18n="crawlLimitHint">同域名 · 最多 3 层 · 5 个并发</p>
        </div>

        <fieldset class="review-options">
          <legend data-i18n="reviewSettings">本地合规审查</legend>
          <label class="check-option">
            <input id="enable-review-input" name="enable_review" type="checkbox">
            <span data-i18n="enableReview">启用合规审查（本地模型，不上传页面内容）</span>
          </label>
          <div id="review-suboptions" class="review-suboptions">
            <label class="check-option">
              <input id="deep-review-input" name="deep_review" type="checkbox">
              <span data-i18n="deepReview">打开详情页取证（详情页计入最大页数）</span>
            </label>
          </div>
        </fieldset>

        <div class="form-actions">
          <button id="submit-button" class="primary-button" type="submit">
          <span id="button-label" data-i18n="start">开始抓取</span>
          <span id="spinner" class="spinner hidden" aria-hidden="true"></span>
          </button>
          <button id="stop-button" class="stop-button hidden" type="button" data-i18n="stop">停止</button>
        </div>
      </form>
      <dialog id="classification-dialog" class="classification-dialog" aria-labelledby="classification-title">
        <h2 id="classification-title" data-i18n="classificationTitle">确认主题标签</h2>
        <p data-i18n="classificationDescription">
          输入要保留的主题，用逗号分隔。系统会自动加入“不是政策”；主题分类信心低于 85% 的记录会转人工复核。
        </p>
        <label for="classification-label-input" data-i18n="classificationLabelsLabel">主题标签</label>
        <textarea id="classification-label-input" rows="3" maxlength="700"
          placeholder="例如：住房、教育、环境保护"></textarea>
        <p id="classification-error" class="classification-error hidden" role="alert"></p>
        <div class="classification-actions">
          <button id="classification-cancel" class="text-button" type="button" data-i18n="cancel">取消</button>
          <button id="classification-confirm" class="primary-button" type="button" data-i18n="classificationConfirm">确认标签并开始</button>
        </div>
      </dialog>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      <section id="progress-panel" class="progress-panel hidden" aria-live="polite">
        <div class="progress-heading">
          <strong id="progress-section">正在准备</strong>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Crawl progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="progress-stats">
          <span><b id="progress-pages">0</b> <span data-i18n="pagesCrawled">页面</span></span>
          <span><b id="progress-sections">0</b> <span data-i18n="sectionsCrawled">栏目</span></span>
          <span><b id="progress-rows">0</b> <span data-i18n="rowsFound">条数据</span></span>
        </div>
      </section>
    </section>

    <section id="error-panel" class="error-panel hidden" role="alert">
      <span class="error-icon" aria-hidden="true">!</span>
      <p id="error-message"></p>
    </section>

    <section id="results-panel" class="panel results-panel hidden" aria-labelledby="results-title">
      <div class="results-heading">
        <div>
          <p class="eyebrow" data-i18n="resultsEyebrow">提取结果</p>
          <h2 id="results-title"><span data-i18n="totalPrefix">共抓到</span> <span id="total-count">0</span> <span data-i18n="totalSuffix">条</span></h2>
          <p id="crawl-summary" class="crawl-summary hidden"></p>
        </div>
        <div class="result-actions">
          <button id="download-button" class="secondary-button" type="button" data-i18n="download">下载 Excel</button>
          <button id="retry-button" class="text-button" type="button" data-i18n="retry">重新抓取</button>
        </div>
      </div>
      <p class="hint" data-i18n="rowHint">点选一行可以告诉 Lioran 哪条记录才是正确结果。</p>
      <section id="review-results" class="review-results hidden">
        <div id="review-summary" class="review-summary"></div>
        <div id="review-tabs" class="review-tabs" role="tablist" aria-label="审核分类">
          <button type="button" class="review-tab" data-decision="all" data-i18n="reviewAll">全部</button>
          <button type="button" class="review-tab" data-decision="included" data-i18n="reviewIncluded">有效保留</button>
          <button type="button" class="review-tab" data-decision="excluded" data-i18n="reviewExcluded">排除</button>
          <button type="button" class="review-tab" data-decision="future" data-i18n="reviewFuture">待生效</button>
          <button type="button" class="review-tab" data-decision="needs_review" data-i18n="reviewManual">待人工复核</button>
        </div>
        <div class="table-wrap">
          <table id="review-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        <button id="review-load-more" class="text-button hidden" type="button">加载更多</button>
      </section>
      <div id="extraction-table-wrap" class="table-wrap">
        <table id="results-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="saved-reviews" class="panel saved-reviews hidden" aria-labelledby="saved-reviews-title">
      <h2 id="saved-reviews-title" data-i18n="savedReviews">本机已保存的审查</h2>
      <div id="saved-review-list" class="saved-review-list"></div>
    </section>

    <footer class="footer" data-i18n="disclaimer">
      仅用于公开数据，请遵守目标网站条款与当地法律法规。
    </footer>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
